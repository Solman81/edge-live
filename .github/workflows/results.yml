name: results

# Started by Supabase (exact times): "settle" every 2 hours, "summary" once a day.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "settle or summary"
        default: "settle"

concurrency:
  group: results-${{ inputs.mode || 'settle' }}
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Madrid
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      EDGE_TELEGRAM_TOKEN: ${{ secrets.EDGE_TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u results.py "${{ inputs.mode || 'settle' }}"
